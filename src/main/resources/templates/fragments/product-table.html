<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="productTable(products)">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>External ID</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="3">No products loaded</td>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.externalId}">ext-1</td>
            <td th:text="${product.name}">Sample Product</td>
        </tr>
        </tbody>
    </table>
</th:block>
</body>
</html>
