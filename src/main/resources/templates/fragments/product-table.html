<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="product-results" class="wa-stack wa-gap-m" th:fragment="productResults">
    <wa-callout th:if="${tableError}" variant="danger">
        <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
        <span th:text="${tableError}">Products could not be loaded.</span>
    </wa-callout>

    <div class="product-table-shell">
        <table class="product-table-main">
            <thead>
            <tr>
                <th>Title</th>
                <th>Vendor</th>
                <th>Created date</th>
                <th>Updated date</th>
                <th>Product type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6">No products loaded.</td>
            </tr>
            <tr data-product-row th:each="product : ${products}">
                <td>
                    <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.title}">Product</a>
                </td>
                <td th:text="${product.vendor}">Vendor</td>
                <td th:text="${#temporals.format(product.createdAt, 'MM/dd/yyyy')}">01/01/2026</td>
                <td th:text="${#temporals.format(product.updatedAt, 'MM/dd/yyyy')}">01/01/2026</td>
                <td th:text="${product.productTypeName}">Type</td>
                <td>
                    <wa-button th:attr="data-dialog='open delete-product-dialog-' + ${product.id}"
                               appearance="plain"
                               size="s">
                        <wa-icon class="product-icon-danger" name="trash" label="Delete product"></wa-icon>
                    </wa-button>
                    <wa-dialog th:id="'delete-product-dialog-' + ${product.id}"
                               label="Delete product"
                               light-dismiss>
                        <p th:text="'Delete ' + ${product.title} + '?'">Delete product?</p>
                        <div slot="footer" class="wa-cluster wa-gap-s wa-justify-content-end">
                            <wa-button class="product-button-neutral" data-dialog="close" appearance="outlined">Cancel</wa-button>
                            <wa-button variant="danger"
                                       th:hx-delete="@{/product/{id}(id=${product.id})}"
                                       hx-target="#product-list-content"
                                       hx-swap="outerHTML"
                                       hx-include="#product-search">
                                <wa-icon slot="start" name="trash"></wa-icon>
                                Delete
                            </wa-button>
                        </div>
                    </wa-dialog>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
