<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section}, ${pageScript})}">
<section class="wa-stack wa-gap-l">
    <h3 class="wa-heading-xl" th:text="${screenTitle}">Product Detail</h3>

    <form id="product-form"
          class="wa-stack wa-gap-l"
          method="post"
          th:object="${product}"
          th:action="${product.id == null} ? @{/product} : @{/product/{id}(id=${product.id})}">
        <input type="hidden" th:field="*{id}">

        <wa-callout th:if="${#fields.hasGlobalErrors()}" variant="danger">
            <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
            <span th:each="error : ${#fields.globalErrors()}" th:text="${error}">Validation error</span>
        </wa-callout>

        <div class="wa-grid wa-gap-m product-form-fields" style="--min-column-size: 16rem;">
            <wa-input label="Title"
                      placeholder="Enter product title"
                      size="m"
                      required
                      id="title"
                      name="title"
                      th:value="*{title}"></wa-input>
            <wa-select label="Product type"
                       placeholder="Choose product type"
                       size="m"
                       required
                       id="productTypeId"
                       name="productTypeId"
                       th:value="*{productTypeId}">
                <wa-option value="">Choose product type</wa-option>
                <wa-option th:each="type : ${productTypes}"
                           th:value="${type.id}"
                           th:selected="${type.id == product.productTypeId}"
                           th:text="${type.name}">Type</wa-option>
            </wa-select>
            <wa-input label="Vendor"
                      placeholder="Enter vendor"
                      size="m"
                      required
                      id="vendor"
                      name="vendor"
                      th:value="*{vendor}"></wa-input>
        </div>

        <wa-textarea label="Description"
                     placeholder="Enter product description"
                     size="m"
                     id="bodyHtml"
                     name="bodyHtml"
                     th:value="*{bodyHtml}"></wa-textarea>

        <wa-card with-header>
            <div slot="header" class="wa-split wa-gap-s wa-align-items-center">
                <div class="wa-cluster wa-gap-xs wa-align-items-center">
                    <span class="wa-font-weight-semibold">Variants</span>
                    <wa-badge variant="success">
                        <span id="available-variant-count" th:text="*{availableVariantCount}">0</span>
                        available
                    </wa-badge>
                </div>
                <wa-button id="add-variant-button" class="product-button-positive" type="button">
                    <wa-icon slot="start" name="plus"></wa-icon>
                    Add variant
                </wa-button>
            </div>
            <wa-callout id="variant-error" class="product-callout-hidden" variant="danger">
                <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
                Add at least one variant before saving.
            </wa-callout>
            <div id="variants-list" class="wa-stack wa-gap-m">
                <div class="product-variant-row wa-grid wa-gap-s wa-align-items-end"
                     style="--min-column-size: 11rem;"
                     th:each="variant, stat : *{variants}">
                    <input type="hidden"
                           data-name="id"
                           th:id="|variants${stat.index}.id|"
                           th:name="|variants[${stat.index}].id|"
                           th:value="${variant.id}">
                    <wa-input label="Variant title"
                              placeholder="Enter variant title"
                              size="m"
                              required
                              data-name="title"
                              th:id="|variants${stat.index}.title|"
                              th:name="|variants[${stat.index}].title|"
                              th:value="${variant.title}"></wa-input>
                    <wa-input label="SKU"
                              placeholder="Enter SKU"
                              size="m"
                              required
                              data-name="sku"
                              th:id="|variants${stat.index}.sku|"
                              th:name="|variants[${stat.index}].sku|"
                              th:value="${variant.sku}"></wa-input>
                    <input type="hidden" data-name="availableHidden" th:name="|variants[${stat.index}].available|" value="false">
                    <wa-checkbox value="true"
                                 data-name="available"
                                 th:id="|variants${stat.index}.available|"
                                 th:checked="${variant.available}">Available</wa-checkbox>
                    <wa-input label="Price"
                              placeholder="Enter price"
                              size="m"
                              type="number"
                              min="0"
                              max="100000000"
                              step="1"
                              required
                              data-name="price"
                              th:id="|variants${stat.index}.price|"
                              th:name="|variants[${stat.index}].price|"
                              th:value="${variant.price}"></wa-input>
                    <wa-button type="button" appearance="plain" size="s" class="delete-variant-button">
                        <wa-icon class="product-icon-danger" name="trash" label="Delete variant"></wa-icon>
                    </wa-button>
                </div>
            </div>
        </wa-card>

        <div class="wa-cluster wa-gap-s wa-justify-content-end">
            <wa-button class="product-button-neutral" href="/product" appearance="outlined">Cancel</wa-button>
            <wa-button type="submit" variant="brand">Save</wa-button>
        </div>
    </form>

    <template id="variant-template">
        <div class="product-variant-row wa-grid wa-gap-s wa-align-items-end" style="--min-column-size: 11rem;">
            <input type="hidden" data-name="id">
            <wa-input label="Variant title" placeholder="Enter variant title" size="m" required data-name="title"></wa-input>
            <wa-input label="SKU" placeholder="Enter SKU" size="m" required data-name="sku"></wa-input>
            <input type="hidden" data-name="availableHidden" value="false">
            <wa-checkbox value="true" checked data-name="available">Available</wa-checkbox>
            <wa-input label="Price" placeholder="Enter price" size="m" type="number" min="0" max="100000000" step="1" required data-name="price"></wa-input>
            <wa-button type="button" appearance="plain" size="s" class="delete-variant-button">
                <wa-icon class="product-icon-danger" name="trash" label="Delete variant"></wa-icon>
            </wa-button>
        </div>
    </template>
</section>
</html>
