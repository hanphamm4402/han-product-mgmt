<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Han Product Management</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script type="module" src="https://unpkg.com/@webawesome/ui"></script>
</head>
<body>
<main>
    <section>
        <h1>Han Product Management</h1>
        <wa-button hx-get="/products" hx-target="#product-table" hx-swap="innerHTML">
            Load Products
        </wa-button>
    </section>

    <section id="product-form" th:replace="~{fragments/product-form :: productForm}"></section>

    <section id="product-table" th:replace="~{fragments/product-table :: productTable(${products})}"></section>
</main>
</body>
</html>
