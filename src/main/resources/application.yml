spring:
  application:
    name: han-product-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/han_product_mngt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  jackson:
    serialization:
      indent-output: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.jdbc.core: INFO
    org.flywaydb: INFO

app:
  scheduling:
    product-audit-delay: ${PRODUCT_AUDIT_DELAY:PT24H}
