services:
  postgres:
    image: postgres:18
    container_name: han-product-mgmt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: han_product_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d han_product_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
